services:

  redis:
    image: redis:7-alpine
    container_name: contract-intelligence-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: contract-intelligence-api

    restart: unless-stopped

    env_file:
      - .env

    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

      TESSERACT_CMD: /usr/bin/tesseract
      POPPLER_PATH: /usr/bin

    ports:
      - "8000:8000"

    volumes:
      - ./data:/app/data
      - ./models:/app/models

    depends_on:
      redis:
        condition: service_healthy

    command:
      [
        "uvicorn",
        "backend.app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]


  celery:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: contract-intelligence-celery

    restart: unless-stopped

    env_file:
      - .env

    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

      TESSERACT_CMD: /usr/bin/tesseract
      POPPLER_PATH: /usr/bin

    volumes:
      - ./data:/app/data
      - ./models:/app/models

    depends_on:
      redis:
        condition: service_healthy

    command:
      [
        "celery",
        "-A",
        "backend.app.celery_app.celery_app",
        "worker",
        "--loglevel=info",
        "--pool=solo"
      ]


volumes:
  redis_data: